<title>広島リフォーム案件帳</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Zen+Old+Mincho:wght@700&display=swap">
<style>
/* Layout: 上に「お金と件数の要約」、下に案件の帳面。案件を開くと右（スマホでは下）に詳細 */
:root{
  --bg:#f1f3f2; --surface:#fcfdfc; --ink:#18201f; --muted:#5a6765; --line:#d3dad8;
  --accent:#1f5c63; --accent-ink:#ffffff; --accent-soft:#dcebec;
  --warn:#8a5300; --warn-soft:#fbefd9; --bad:#a3271d; --good:#2d6a3e; --sample:#7a5a12;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --f-logo:"Zen Old Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121716; --surface:#1a2120; --ink:#e6ecea; --muted:#9eaba8; --line:#2f3937;
  --accent:#7cc0c6; --accent-ink:#0f1a1b; --accent-soft:#1d3436;
  --warn:#f0b35c; --warn-soft:#3a2d17; --bad:#f08a80; --good:#86c79a; --sample:#e2b467; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121716; --surface:#1a2120; --ink:#e6ecea; --muted:#9eaba8; --line:#2f3937;
  --accent:#7cc0c6; --accent-ink:#0f1a1b; --accent-soft:#1d3436;
  --warn:#f0b35c; --warn-soft:#3a2d17; --bad:#f08a80; --good:#86c79a; --sample:#e2b467; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14.5px;line-height:1.7;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1180px;margin:0 auto;padding-block:20px 48px}
h1,h2,h3{margin:0;text-wrap:balance}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
header{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.logo{font-family:var(--f-logo);font-size:22px}
.logo small{font-family:var(--f-body);font-size:12px;color:var(--muted);margin-left:10px;font-weight:400}
.status{font-size:12.5px;color:var(--muted)}
.banner{padding:10px 14px;border-radius:6px;background:var(--warn-soft);color:var(--ink);font-size:13.5px;margin-bottom:16px;border-left:3px solid var(--warn)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:20px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:12px 14px}
.kpi .k{font-size:12px;color:var(--muted);letter-spacing:.04em}
.kpi .v{font-size:22px;font-weight:700;margin-top:2px}
.kpi .s{font-size:12px;color:var(--muted)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;flex-wrap:wrap}
.tab{font:inherit;background:none;border:0;border-bottom:2px solid transparent;padding:8px 14px;color:var(--muted);cursor:pointer;font-weight:500}
.tab[aria-selected="true"]{color:var(--ink);border-color:var(--accent)}
.layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,440px);gap:20px;align-items:start}
.layout.nodetail{grid-template-columns:minmax(0,1fr)}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{font:inherit;font-size:13px;border:0;background:var(--surface);color:var(--muted);padding:4px 12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.list{display:flex;flex-direction:column;gap:8px}
.job{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:12px 14px;cursor:pointer;text-align:left;font:inherit;color:inherit;width:100%;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px}
.job:hover{border-color:var(--accent)}
.job[aria-current="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.job .t{font-weight:700}
.job .m{font-size:12.5px;color:var(--muted)}
.job .amt{text-align:right;font-weight:700}
.bar{grid-column:1/-1;display:grid;grid-template-columns:repeat(11,1fr);gap:2px;margin-top:6px}
.bar i{height:4px;border-radius:2px;background:var(--line)}
.bar i.on{background:var(--accent)}
.next{grid-column:1/-1;font-size:12.5px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{font-size:11.5px;padding:1px 8px;border-radius:999px;background:var(--accent-soft);color:var(--ink);white-space:nowrap}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.sample{background:none;border:1px dashed var(--sample);color:var(--sample)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:18px;position:sticky;top:12px}
.panel h2{font-size:18px}
.panel .sub{color:var(--muted);font-size:12.5px;margin-bottom:12px}
.steps{list-style:none;padding:0;margin:12px 0;display:flex;flex-direction:column;gap:0}
.steps li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px;font-size:13px;color:var(--muted);padding:2px 0}
.steps li::before{content:"";width:10px;height:10px;border-radius:50%;border:1.5px solid var(--line);margin:6px 0 0 5px}
.steps li.done{color:var(--ink)}
.steps li.done::before{background:var(--accent);border-color:var(--accent)}
.steps li.cur{color:var(--ink);font-weight:700}
.steps li.cur::before{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
fieldset{border:0;border-top:1px solid var(--line);padding:12px 0 4px;margin:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 12px}
legend{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.06em;padding:0 6px 0 0}
.f{display:flex;flex-direction:column;gap:3px;min-width:0}
.f.full{grid-column:1/-1}
label{font-size:12px;color:var(--muted)}
input,select,textarea{font:inherit;font-size:14px;padding:7px 9px;border:1px solid var(--line);border-radius:5px;background:var(--bg);color:var(--ink);width:100%;min-width:0}
textarea{min-height:64px;resize:vertical}
.calc{grid-column:1/-1;font-size:13px;background:var(--bg);border-radius:5px;padding:8px 10px}
.warns{display:flex;flex-direction:column;gap:6px;margin:10px 0}
.warns p{margin:0;font-size:12.5px;padding:6px 10px;border-radius:5px;background:var(--warn-soft);color:var(--ink);border-left:3px solid var(--warn)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btn{font:inherit;font-weight:700;border-radius:5px;padding:8px 14px;cursor:pointer;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:none;color:var(--ink);border-color:var(--line)}
.btn.danger{background:none;color:var(--bad);border-color:var(--line)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.msg{font-size:12.5px;margin:8px 0 0}
.msg.bad{color:var(--bad)} .msg.good{color:var(--good)}
.log{font-size:12px;color:var(--muted);margin:12px 0 0;padding-left:1.1em;max-height:160px;overflow:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px}
.tablebox{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:6px}
th,td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:500;white-space:nowrap}
td.r,th.r{text-align:right}
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:18px}
.card h2{font-size:17px;margin-bottom:10px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 14px}
.empty{color:var(--muted);padding:28px 8px;text-align:center}
.close{float:right}
@media (max-width:900px){.layout{grid-template-columns:minmax(0,1fr)}.panel{position:static}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){fieldset,.grid2{grid-template-columns:minmax(0,1fr)}.kpi .v{font-size:19px}}
</style>

<div class="wrap">
  <header>
    <div class="logo">広島リフォーム案件帳<small>受注から職人への支払いまで</small></div>
    <div class="status" id="status" aria-live="polite">読み込み中…</div>
  </header>
  <div class="banner" id="banner" hidden></div>

  <div class="kpis" id="kpis">
    <div class="kpi"><div class="k">進行中の案件</div><div class="v num" id="k1">—</div><div class="s" id="k1s">&nbsp;</div></div>
    <div class="kpi"><div class="k">お客様からの入金待ち</div><div class="v num" id="k2">—</div><div class="s" id="k2s">&nbsp;</div></div>
    <div class="kpi"><div class="k">職人への支払予定</div><div class="v num" id="k3">—</div><div class="s" id="k3s">&nbsp;</div></div>
    <div class="kpi"><div class="k">粗利（契約済みの案件）</div><div class="v num" id="k4">—</div><div class="s" id="k4s">&nbsp;</div></div>
  </div>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" id="t-jobs" aria-selected="true">案件</button>
    <button class="tab" role="tab" id="t-money" aria-selected="false">お金</button>
    <button class="tab" role="tab" id="t-crafts" aria-selected="false">職人</button>
    <button class="tab" role="tab" id="t-new" aria-selected="false">新規受付</button>
  </div>

  <div id="v-jobs">
    <div class="layout nodetail" id="layout">
      <div>
        <div class="toolbar">
          <div class="seg" id="jobfilter"><button aria-pressed="true" data-v="open">進行中</button><button aria-pressed="false" data-v="all">すべて</button></div>
          <input id="q" placeholder="お客様名・地域・工事名で探す" style="max-width:260px">
        </div>
        <div class="list" id="jobs"><p class="empty">案件を読み込んでいます…</p></div>
      </div>
      <aside class="panel" id="panel" hidden></aside>
    </div>
  </div>

  <div id="v-money" hidden>
    <h2 style="font-size:16px;margin:4px 0 8px">お客様からの入金待ち</h2>
    <div class="tablebox"><table><thead><tr><th>案件</th><th>お客様</th><th>段階</th><th class="r">請求額（税込）</th></tr></thead><tbody id="m-in"></tbody></table></div>
    <h2 style="font-size:16px;margin:24px 0 8px">職人への支払予定</h2>
    <div class="tablebox"><table><thead><tr><th>案件</th><th>職人</th><th>請求書</th><th>支払期限の目安</th><th class="r">支払額（税込）</th></tr></thead><tbody id="m-out"></tbody></table></div>
    <p class="msg" style="color:var(--muted)">支払期限の目安は、お客様の入金日から1か月です（建設業法の下請代金の支払いの考え方にもとづく目安。個別の扱いは専門家に確認してください）。</p>
  </div>

  <div id="v-crafts" hidden>
    <div class="layout" style="grid-template-columns:minmax(0,1fr) minmax(0,380px)">
      <div class="tablebox"><table><thead><tr><th>名前</th><th>職種</th><th>地域</th><th>建設業許可</th><th>インボイス登録</th><th>案件</th></tr></thead><tbody id="crafts"></tbody></table></div>
      <form class="card" id="craftform">
        <h2>職人を登録する</h2>
        <div class="grid2">
          <div class="f"><label for="c-name">名前・屋号</label><input id="c-name" required></div>
          <div class="f"><label for="c-trade">職種</label><select id="c-trade"></select></div>
          <div class="f"><label for="c-area">主な地域</label><select id="c-area"></select></div>
          <div class="f"><label for="c-phone">電話</label><input id="c-phone" inputmode="tel"></div>
          <div class="f"><label for="c-lic">建設業許可</label><select id="c-lic"><option>あり</option><option>なし（500万円未満のみ）</option></select></div>
          <div class="f"><label for="c-tno">インボイス登録番号</label><input id="c-tno" placeholder="T から始まる13桁"></div>
          <div class="f full"><label for="c-note">得意なこと・作風</label><textarea id="c-note"></textarea></div>
        </div>
        <div class="actions"><button class="btn" type="submit">登録する</button></div>
        <p class="msg" id="c-msg" hidden></p>
      </form>
    </div>
  </div>

  <div id="v-new" hidden>
    <form class="card" id="newform" style="max-width:720px">
      <h2>新しい相談を受け付ける</h2>
      <div class="grid2">
        <div class="f"><label for="n-name">お客様名</label><input id="n-name" required></div>
        <div class="f"><label for="n-phone">電話</label><input id="n-phone" inputmode="tel"></div>
        <div class="f"><label for="n-area">地域</label><select id="n-area"></select></div>
        <div class="f"><label for="n-seg">建物</label><select id="n-seg"><option>戸建て</option><option>マンション</option><option>店舗・オフィス</option><option>賃貸物件</option></select></div>
        <div class="f full"><label for="n-addr">住所（町名まで）</label><input id="n-addr"></div>
        <div class="f full"><label for="n-title">工事の内容</label><input id="n-title" placeholder="例：LDKの床を無垢材に張り替え" required></div>
        <div class="f full"><label for="n-memo">ご要望・メモ</label><textarea id="n-memo"></textarea></div>
      </div>
      <div class="actions"><button class="btn" type="submit">受け付ける</button></div>
      <p class="msg" id="n-msg" hidden></p>
    </form>
  </div>
</div>

<script>
const AREAS=["広島市中区","広島市東区","広島市南区","広島市西区","広島市安佐南区","広島市安佐北区","広島市安芸区","広島市佐伯区","廿日市市","府中町","海田町","坂町","熊野町","呉市","東広島市","大竹市","その他"];
const TRADES=["大工","内装仕上げ（クロス・床）","左官","タイル","設備（水まわり）","電気・照明","塗装","家具・建具","解体","その他"];
const STEPS=[
 {l:"受付",need:"craftsmanId",ask:"現調を頼む職人を選ぶ"},
 {l:"現調依頼中",need:"surveyDate",ask:"現調日を入れる"},
 {l:"現調済み",need:"craftsmanQuote",ask:"職人の見積額を入れる"},
 {l:"職人見積受領",need:"customerPrice",ask:"お客様への見積額を決める"},
 {l:"お客様へ見積提示",need:"contractDate",ask:"契約日を入れる"},
 {l:"契約済み",need:"startDate",ask:"着工日を入れる"},
 {l:"施工中",need:"doneDate",ask:"完工日を入れる"},
 {l:"完工・入金待ち",need:"customerPaidDate",ask:"お客様の入金日を入れる"},
 {l:"入金確認・請求書待ち",need:["invoiceNo","invoiceAmount","invoiceDate"],ask:"職人の請求書（番号・金額・日付）を入れる"},
 {l:"職人へ支払い待ち",need:"paidDate",ask:"職人への支払日を入れる"},
 {l:"完了",need:null,ask:"この案件は完了しています"}
];
const LABELS={craftsmanId:"担当職人",surveyDate:"現調日",craftsmanQuote:"職人の見積額",customerPrice:"お客様への見積額",contractDate:"契約日",startDate:"着工日",doneDate:"完工日",customerPaidDate:"お客様の入金日",invoiceNo:"請求書番号",invoiceAmount:"請求額",invoiceDate:"請求書の日付",paidDate:"職人への支払日"};
const S={db:null,canWrite:true,jobs:[],crafts:[],sel:null,filter:"open",q:"",loaded:{jobs:false,crafts:false}};
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const yen=n=>(n||n===0)&&n!==""?"¥"+Number(n).toLocaleString("ja-JP"):"—";
const today=()=>new Date(Date.now()+9*3600e3).toISOString().slice(0,10);
const addMonth=d=>{if(!d)return"";const [y,m,dd]=d.split("-").map(Number);const t=new Date(Date.UTC(y,m,dd));if(t.getUTCMonth()!==m%12)t.setUTCDate(0);return t.toISOString().slice(0,10);};
const fmtD=d=>d?d.replace(/^(\d+)-(\d+)-(\d+)$/,(_,y,m,dd)=>`${+m}/${+dd}`):"—";
const craft=id=>S.crafts.find(c=>c.id===id);
const has=(j,k)=>j[k]!==undefined&&j[k]!==null&&j[k]!=="";
function fill(sel,list){sel.innerHTML=list.map(v=>`<option>${esc(v)}</option>`).join("");}
fill($("n-area"),AREAS);fill($("c-area"),AREAS);fill($("c-trade"),TRADES);

function warnsFor(j){
  const w=[],c=craft(j.craftsmanId);
  if(Number(j.customerPrice)>=5000000)w.push("お客様への請負金額が500万円（税込）以上です。元請として請け負うには建設業許可が必要です（建築一式工事は1,500万円以上）。");
  if(c&&c.license!=="あり"&&Number(j.craftsmanQuote)>=5000000)w.push(`${c.name}さんは建設業許可なしで登録されています。500万円以上の工事は、許可のある職人に回す必要があります。`);
  if(c&&!c.tno)w.push(`${c.name}さんのインボイス登録番号が未登録です。消費税の扱いを税理士に確認してください。`);
  if(has(j,"invoiceAmount")&&has(j,"craftsmanQuote")&&Number(j.invoiceAmount)!==Number(j.craftsmanQuote))w.push(`請求額が見積額と${yen(Math.abs(j.invoiceAmount-j.craftsmanQuote))}違います。追加工事か確認してください。`);
  if(j.step===9&&j.customerPaidDate&&addMonth(j.customerPaidDate)<today())w.push("支払期限の目安（入金日から1か月）を過ぎています。");
  if(has(j,"customerPrice")&&has(j,"craftsmanQuote")&&Number(j.customerPrice)<Number(j.craftsmanQuote))w.push("お客様への見積額が職人の見積額を下回っています。");
  return w;
}

function kpis(){
  const open=S.jobs.filter(j=>j.step<10);
  $("k1").textContent=open.length+"件";
  $("k1s").textContent=`うち現調・見積の段階 ${open.filter(j=>j.step<=4).length}件`;
  const inc=S.jobs.filter(j=>j.step>=5&&j.step<=7);
  $("k2").textContent=yen(inc.reduce((a,j)=>a+Number(j.customerPrice||0),0));
  $("k2s").textContent=`${inc.length}件（契約済み・未入金）`;
  const out=S.jobs.filter(j=>j.step===8||j.step===9);
  $("k3").textContent=yen(out.reduce((a,j)=>a+Number(j.invoiceAmount||j.craftsmanQuote||0),0));
  const dues=out.filter(j=>j.customerPaidDate).map(j=>addMonth(j.customerPaidDate)).sort();
  $("k3s").textContent=dues.length?`最も近い期限の目安 ${fmtD(dues[0])}`:`${out.length}件`;
  const won=S.jobs.filter(j=>j.step>=5&&has(j,"customerPrice")&&has(j,"craftsmanQuote"));
  const gp=won.reduce((a,j)=>a+(j.customerPrice-j.craftsmanQuote),0),sales=won.reduce((a,j)=>a+Number(j.customerPrice),0);
  $("k4").textContent=yen(gp);
  $("k4s").textContent=sales?`粗利率 ${(gp/sales*100).toFixed(1)}%・${won.length}件`:"契約済みの案件なし";
}

function renderJobs(){
  const el=$("jobs");
  if(!S.loaded.jobs){return;}
  const q=S.q.trim();
  const list=S.jobs.filter(j=>(S.filter==="all"||j.step<10)&&(!q||[j.customerName,j.area,j.title,j.no].join(" ").includes(q)))
    .sort((a,b)=>a.step-b.step||String(b.createdAt).localeCompare(String(a.createdAt)));
  if(!S.jobs.length){el.innerHTML='<p class="empty">まだ案件がありません。「新規受付」タブから最初の相談を登録してください。</p>';return;}
  if(!list.length){el.innerHTML='<p class="empty">条件に合う案件がありません。</p>';return;}
  el.innerHTML=list.map(j=>{
    const c=craft(j.craftsmanId),w=warnsFor(j);
    return `<button class="job" data-id="${esc(j.id)}" aria-current="${S.sel===j.id}">
      <div><div class="t">${esc(j.title)}</div><div class="m">${esc(j.no)}・${esc(j.customerName)} 様・${esc(j.area)}・${esc(j.seg)}${c?"・"+esc(c.name):""}</div></div>
      <div class="amt num">${yen(j.customerPrice)}</div>
      <div class="bar" aria-hidden="true">${STEPS.map((_,i)=>`<i class="${i<=j.step?"on":""}"></i>`).join("")}</div>
      <div class="next"><span class="pill">${esc(STEPS[j.step].l)}</span><span>${j.step<10?"次："+esc(STEPS[j.step].ask):"完了"}</span>${w.length?`<span class="pill warn">要確認 ${w.length}</span>`:""}${j.sample?'<span class="pill sample">見本</span>':""}</div>
    </button>`;}).join("");
}

function field(j,k,type,extra=""){
  const v=esc(j[k]??"");const dis=S.canWrite?"":"disabled";
  if(k==="craftsmanId"){
    return `<div class="f"><label for="d-${k}">${LABELS[k]}</label><select id="d-${k}" data-k="${k}" ${dis}><option value="">未定</option>${S.crafts.map(c=>`<option value="${esc(c.id)}" ${c.id===j[k]?"selected":""}>${esc(c.name)}（${esc(c.trade)}）</option>`).join("")}</select></div>`;
  }
  return `<div class="f ${extra}"><label for="d-${k}">${LABELS[k]||k}</label><input id="d-${k}" data-k="${k}" type="${type}" value="${v}" ${type==="number"?'inputmode="numeric" min="0" step="1"':""} ${dis}></div>`;
}

function renderPanel(){
  const p=$("panel"),lay=$("layout");
  const j=S.jobs.find(x=>x.id===S.sel);
  if(!j){p.hidden=true;lay.classList.add("nodetail");return;}
  p.hidden=false;lay.classList.remove("nodetail");
  const w=warnsFor(j),gp=has(j,"customerPrice")&&has(j,"craftsmanQuote")?j.customerPrice-j.craftsmanQuote:null;
  const dis=S.canWrite?"":"disabled";
  p.innerHTML=`
    <button class="btn ghost close" id="d-close" type="button">閉じる</button>
    <h2>${esc(j.title)}</h2>
    <div class="sub">${esc(j.no)}・受付 ${fmtD(String(j.createdAt).slice(0,10))}${j.sample?"・見本の案件":""}</div>
    <ol class="steps">${STEPS.map((s,i)=>`<li class="${i<j.step?"done":i===j.step?"cur":""}">${esc(s.l)}</li>`).join("")}</ol>
    ${w.length?`<div class="warns">${w.map(x=>`<p>${esc(x)}</p>`).join("")}</div>`:""}
    <div class="actions">
      ${j.step<10?`<button class="btn" id="d-next" type="button" ${dis}>次へ：${esc(STEPS[j.step+1].l)}</button>`:""}
      ${j.step>0?`<button class="btn ghost" id="d-back" type="button" ${dis}>一つ戻す</button>`:""}
    </div>
    <p class="msg" id="d-msg" hidden></p>
    <fieldset><legend>お客様</legend>
      <div class="f"><label for="d-customerName">お名前</label><input id="d-customerName" data-k="customerName" value="${esc(j.customerName)}" ${dis}></div>
      <div class="f"><label for="d-phone">電話</label><input id="d-phone" data-k="phone" value="${esc(j.phone)}" ${dis}></div>
      <div class="f"><label for="d-area">地域</label><select id="d-area" data-k="area" ${dis}>${AREAS.map(a=>`<option ${a===j.area?"selected":""}>${esc(a)}</option>`).join("")}</select></div>
      <div class="f"><label for="d-address">住所</label><input id="d-address" data-k="address" value="${esc(j.address)}" ${dis}></div>
      <div class="f full"><label for="d-memo">ご要望・メモ</label><textarea id="d-memo" data-k="memo" ${dis}>${esc(j.memo)}</textarea></div>
    </fieldset>
    <fieldset><legend>現調・見積</legend>
      ${field(j,"craftsmanId")}${field(j,"surveyDate","date")}
      ${field(j,"craftsmanQuote","number")}${field(j,"customerPrice","number")}
      <div class="calc num">粗利 ${gp===null?"—":yen(gp)}${gp!==null&&j.customerPrice?`（${(gp/j.customerPrice*100).toFixed(1)}%）`:""}　金額はすべて税込</div>
    </fieldset>
    <fieldset><legend>契約・施工</legend>
      ${field(j,"contractDate","date")}${field(j,"startDate","date")}${field(j,"doneDate","date")}
    </fieldset>
    <fieldset><legend>お金</legend>
      ${field(j,"customerPaidDate","date")}
      <div class="f"><label>職人への支払期限の目安</label><input value="${j.customerPaidDate?addMonth(j.customerPaidDate):""}" disabled></div>
      ${field(j,"invoiceNo","text")}${field(j,"invoiceDate","date")}
      ${field(j,"invoiceAmount","number")}${field(j,"paidDate","date")}
    </fieldset>
    <ul class="log">${(j.log||[]).slice().reverse().map(l=>`<li>${esc(fmtD(l.at.slice(0,10)))} ${esc(l.text)}</li>`).join("")}</ul>
    ${S.canWrite?`<div class="actions"><button class="btn danger" id="d-del" type="button">この案件を削除</button><span id="d-delc" hidden>本当に削除しますか？ <button class="btn danger" id="d-del2" type="button">削除する</button> <button class="btn ghost" id="d-delno" type="button">やめる</button></span></div>`:""}
  `;
  $("d-close").onclick=()=>{S.sel=null;renderJobs();renderPanel();};
  p.querySelectorAll("[data-k]").forEach(inp=>inp.addEventListener("change",()=>saveField(j,inp)));
  if($("d-next"))$("d-next").onclick=()=>advance(j,1);
  if($("d-back"))$("d-back").onclick=()=>advance(j,-1);
  if($("d-del")){$("d-del").onclick=()=>{$("d-delc").hidden=false;};$("d-delno").onclick=()=>{$("d-delc").hidden=true;};
    $("d-del2").onclick=async()=>{try{await S.db.collection("jobs").doc(j.id).delete();S.sel=null;}catch(e){msg("d-msg","削除できませんでした："+e.message,true);}};}
}

function msg(id,t,bad){const m=$(id);if(!m)return;m.textContent=t;m.className="msg "+(bad?"bad":"good");m.hidden=false;}

async function saveField(j,inp){
  const k=inp.dataset.k;let v=inp.value;
  if(inp.type==="number")v=v===""?"":Math.round(Number(v));
  try{await S.db.collection("jobs").doc(j.id).update({[k]:v});msg("d-msg",`${LABELS[k]||"内容"}を保存しました。`);}
  catch(e){msg("d-msg","保存できませんでした："+(e.code==="invalid_argument"?"書き込む権限がありません。":e.message),true);}
}

async function advance(j,dir){
  const cur=S.jobs.find(x=>x.id===j.id)||j;
  if(dir>0){
    const need=[].concat(STEPS[cur.step].need||[]);
    const miss=need.filter(k=>!has(cur,k));
    if(miss.length){msg("d-msg","先に入れてください："+miss.map(k=>LABELS[k]).join("、"),true);return;}
  }
  const step=cur.step+dir;
  const log=(cur.log||[]).concat({at:new Date().toISOString(),text:(dir>0?"→ ":"← ")+STEPS[step].l});
  try{await S.db.collection("jobs").doc(cur.id).update({step,log});}
  catch(e){msg("d-msg","更新できませんでした："+e.message,true);}
}

function renderMoney(){
  const inc=S.jobs.filter(j=>j.step>=4&&j.step<=7);
  $("m-in").innerHTML=inc.length?inc.map(j=>`<tr><td>${esc(j.title)}<br><span class="m" style="font-size:12px;color:var(--muted)">${esc(j.no)}</span></td><td>${esc(j.customerName)} 様</td><td>${esc(STEPS[j.step].l)}</td><td class="r num">${yen(j.customerPrice)}</td></tr>`).join(""):'<tr><td colspan="4" class="empty">入金待ちの案件はありません。</td></tr>';
  const out=S.jobs.filter(j=>j.step>=7&&j.step<=9).map(j=>({j,due:j.customerPaidDate?addMonth(j.customerPaidDate):""})).sort((a,b)=>(a.due||"9").localeCompare(b.due||"9"));
  $("m-out").innerHTML=out.length?out.map(({j,due})=>{const c=craft(j.craftsmanId);const late=due&&due<today()&&j.step<10;
    return `<tr><td>${esc(j.title)}</td><td>${esc(c?c.name:"未定")}</td><td>${j.invoiceNo?esc(j.invoiceNo)+"（"+fmtD(j.invoiceDate)+"）":"未着"}</td><td class="num" style="${late?"color:var(--bad);font-weight:700":""}">${due?fmtD(due):"入金後に決まる"}</td><td class="r num">${yen(j.invoiceAmount||j.craftsmanQuote)}</td></tr>`;}).join(""):'<tr><td colspan="5" class="empty">支払予定はありません。</td></tr>';
}

function renderCrafts(){
  $("crafts").innerHTML=S.crafts.length?S.crafts.map(c=>{const n=S.jobs.filter(j=>j.craftsmanId===c.id&&j.step<10).length;
    return `<tr><td><b>${esc(c.name)}</b>${c.sample?' <span class="pill sample">見本</span>':""}<br><span style="font-size:12px;color:var(--muted)">${esc(c.note)}</span></td><td>${esc(c.trade)}</td><td>${esc(c.area)}</td><td>${esc(c.license)}</td><td>${c.tno?esc(c.tno):'<span class="pill warn">未登録</span>'}</td><td class="num">${n}件</td></tr>`;}).join(""):'<tr><td colspan="6" class="empty">職人がまだ登録されていません。右のフォームから登録してください。</td></tr>';
}

function renderAll(){kpis();renderJobs();renderPanel();renderMoney();renderCrafts();}

// tabs
const VIEWS=["jobs","money","crafts","new"];
VIEWS.forEach(v=>$("t-"+v).onclick=()=>{VIEWS.forEach(x=>{$("t-"+x).setAttribute("aria-selected",String(x===v));$("v-"+x).hidden=x!==v;});});
$("jobfilter").querySelectorAll("button").forEach(b=>b.onclick=()=>{S.filter=b.dataset.v;$("jobfilter").querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));renderJobs();});
$("q").addEventListener("input",e=>{S.q=e.target.value;renderJobs();});
$("jobs").addEventListener("click",e=>{const b=e.target.closest(".job");if(!b)return;S.sel=b.dataset.id;renderJobs();renderPanel();if(innerWidth<900)$("panel").scrollIntoView({behavior:"smooth"});});

$("newform").addEventListener("submit",async e=>{
  e.preventDefault();
  if(!S.db){msg("n-msg","保存機能が使えない表示のため、受け付けできません。",true);return;}
  const name=$("n-name").value.trim(),title=$("n-title").value.trim();
  if(!name||!title){msg("n-msg","お客様名と工事の内容を入れてください。",true);return;}
  const now=new Date(),jst=new Date(now.getTime()+9*3600e3).toISOString();
  const no="H-"+jst.slice(2,10).replace(/-/g,"")+"-"+jst.slice(11,16).replace(":","");
  try{
    const ref=await S.db.collection("jobs").add({no,createdAt:now.toISOString(),customerName:name,phone:$("n-phone").value.trim(),area:$("n-area").value,seg:$("n-seg").value,address:$("n-addr").value.trim(),title,memo:$("n-memo").value.trim(),step:0,log:[{at:now.toISOString(),text:"受付"}]});
    e.target.reset();msg("n-msg",`${no} として受け付けました。「案件」タブで職人を選んでください。`);S.sel=ref.id;
  }catch(err){msg("n-msg","保存できませんでした："+(err.code==="invalid_argument"?"書き込む権限がありません。":err.message),true);}
});

$("craftform").addEventListener("submit",async e=>{
  e.preventDefault();
  if(!S.db){msg("c-msg","保存機能が使えない表示のため、登録できません。",true);return;}
  const name=$("c-name").value.trim(),tno=$("c-tno").value.trim().toUpperCase();
  if(!name){msg("c-msg","名前を入れてください。",true);return;}
  if(tno&&!/^T\d{13}$/.test(tno)){msg("c-msg","インボイス登録番号は T と13桁の数字です。",true);return;}
  try{await S.db.collection("craftsmen").add({name,trade:$("c-trade").value,area:$("c-area").value,phone:$("c-phone").value.trim(),license:$("c-lic").value,tno,note:$("c-note").value.trim()});
    e.target.reset();msg("c-msg",`${name}さんを登録しました。`);}
  catch(err){msg("c-msg","登録できませんでした："+(err.code==="invalid_argument"?"書き込む権限がありません。":err.message),true);}
});

(async()=>{
  const timer=setTimeout(()=>{if(!S.loaded.jobs){$("status").textContent="データの読み込みに時間がかかっています。";}},10000);
  const db=await claude.use("db");
  if(!db){clearTimeout(timer);$("status").textContent="保存機能が使えない表示です";$("banner").textContent="この表示ではデータを読み書きできません。claude.ai にサインインして開いてください。";$("banner").hidden=false;$("jobs").innerHTML='<p class="empty">データを読み込めませんでした。</p>';return;}
  S.db=db;
  const user=await claude.use("user");
  const cw=user?await user.can("data.write"):null;
  if(cw===false){S.canWrite=false;$("banner").textContent="閲覧のみの権限で開いています。内容の変更はできません。";$("banner").hidden=false;}
  db.collection("craftsmen").onSnapshot(s=>{S.crafts=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>String(a.name).localeCompare(String(b.name),"ja"));S.loaded.crafts=true;renderAll();},err=>{$("status").textContent="職人を読み込めませんでした（"+err.code+"）";});
  db.collection("jobs").onSnapshot(s=>{clearTimeout(timer);S.jobs=s.docs.map(d=>({id:d.id,...d.data()})).map(j=>({...j,step:Number(j.step)||0}));S.loaded.jobs=true;$("status").textContent="最新の状態です・"+new Date().toLocaleTimeString("ja-JP",{hour:"2-digit",minute:"2-digit"});renderAll();},err=>{clearTimeout(timer);$("status").textContent="案件を読み込めませんでした（"+err.code+"）";});
})();
</script>
